name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore debug keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode > "$HOME/.android/debug.keystore"
          sha256sum "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain "-PversionName=${GITHUB_REF_NAME#v}" "-PversionCode=$(git rev-list --count HEAD)"

      - name: Verify APK signature
        run: |
          ls -la app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "app/build/outputs/apk/release/Nimbus ${GITHUB_REF_NAME#v}.apk" --generate-notes --title "Nimbus Weather ${GITHUB_REF_NAME#v}"